name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          zip_file=$(find . -maxdepth 1 -name 'raven-bS-*.zip' | sort -V | tail -n 1)
          if [ -z "$zip_file" ]; then
            echo "No raven-bS-*.zip found in repo root" >&2
            exit 1
          fi
          echo "Extracting $zip_file"
          mkdir -p extracted
          unzip -q -o "$zip_file" -d extracted
          project_dir=$(dirname "$(find extracted -name build.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build jar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: raven-bS
          path: ${{ env.PROJECT_DIR }}/build/out-mods/*.jar
          if-no-files-found: error
          
